<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f2f2f7">
<title>Lab</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#f2f2f7}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;padding:24px}
#f{width:100%;max-width:340px;text-align:center;opacity:0;transition:opacity .3s}
#f.show{opacity:1}
.ic{width:64px;height:64px;border-radius:16px;margin:0 auto 18px;background:linear-gradient(135deg,#3a3a3c,#1c1c1e);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.ic svg{width:28px;height:28px}
h1{font-size:22px;font-weight:700}
p{font-size:15px;color:rgba(60,60,67,.6);margin-top:6px}
input{width:100%;margin-top:22px;height:50px;border-radius:12px;border:0;background:#fff;padding:0 16px;font-size:17px;outline:none;box-shadow:0 0 0 .5px rgba(0,0,0,.08)}
input:focus{box-shadow:0 0 0 2px #007aff}
button{width:100%;margin-top:10px;height:50px;border-radius:12px;border:0;background:#007aff;color:#fff;font-size:17px;font-weight:600;font-family:inherit;transition:transform .15s}
button:active{transform:scale(.97)}button:disabled{opacity:.6}
label{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;font-size:14px;color:rgba(60,60,67,.75)}
.err{color:#ff3b30;font-size:14px;margin-top:10px;min-height:18px}
.shake{animation:sh .4s}@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
</style></head><body>
<form id="f" autocomplete="on">
<div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>
<h1>Private</h1><p>Enter the password to continue.</p>
<input type="text" name="username" value="lab" autocomplete="username" style="display:none" aria-hidden="true">
<input id="pw" type="password" placeholder="Password" autocomplete="current-password" required>
<button id="go" type="submit">Unlock</button>
<label><input id="rm" type="checkbox" checked style="width:auto;height:auto;margin:0;box-shadow:none">Remember on this device</label>
<div class="err" id="err"></div>
</form>
